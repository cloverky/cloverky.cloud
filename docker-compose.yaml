services:
  backend:
    build:
      context: ./clover
    ports:
      - "8000:8000"
    env_file:
      - ./clover/.env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - EXAONE_BASE_URL=http://host.docker.internal:8001/v1
      - EXAONE_MODEL=exaone
    depends_on:
      - pgvector
      - redis
      - neo4j
    restart: always

  frontend:
    build:
      context: ./lucky
    ports:
      - "3000:3000"
    env_file:
      - ./lucky/.env.production
    restart: always
  # 인증 게이트웨이 — auth.cloverky.cloud (JWT 발급 전용, 개인키는 여기에만)
  auth:
    build:
      context: ./clover
    command: uvicorn clover.auth_main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    env_file:
      - ./clover/.env        # 공용 설정 + JWT_PUBLIC_KEY
      - ./clover/.env.auth   # 개인키·OAuth 시크릿 — auth 컨테이너에만 주입
    depends_on:
      - pgvector
      - redis
    restart: always

  pgvector:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=cloverky
      - POSTGRES_PASSWORD=aacloverky04
      - POSTGRES_DB=cloverky
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=wajXovWyoOvtUhtV2Gdax1LQGxguLxFT
      - GENERIC_TIMEZONE=Asia/Seoul
      - N8N_DEFAULT_LOCALE=ko
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/aacloverky04
    volumes:
      - neo4j_data:/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=hisoyeon04@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=aacloverky04
    depends_on:
      - pgvector
    restart: always

volumes:
  pgvector_data:
  redis_data:
  neo4j_data:
  qdrant_data:
  n8n_data:
